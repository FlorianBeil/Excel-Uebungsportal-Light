<meta name="robots" content="noindex">
<script>
  // Pivot-Aufgaben haben eine eigene Seite („Nächste Übung“ aus engine.js verlinkt immer hierher)

    var id = new URLSearchParams(location.search).get("id") || "";
    if (id.indexOf("pivot-") === 0) location.replace("pivot-uebung.html" + location.search);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="assets/geteilt/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html">
      <span class="brand__icon"><img src="assets/geteilt/img/logo-white.webp" alt=""></span>
      <span class="brand__wordmark">Excel<span class="dot">.</span>Flo</span>
    </a>
    <a class="site-header__back" href="index.html">← Alle Übungen</a>
  </div>

<main>
